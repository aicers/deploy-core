name: CI

# This crate is consumed by `bootler` at a pinned git rev, so a break here
# reaches a shipping installer. Until now nothing ran on push or on a pull
# request at all.
#
# CHANGE FILTER: `changes` classifies the run's diff and `check`, `test` and
# `platforms` gate on its `docs_only` output, so a pull request that only
# touches inert documentation does not build and test the crate on three
# platforms. `markdown` is deliberately ungated -- a docs-only change is
# exactly the change that needs the Markdown lint to run.
#
# THE GATE IS FAIL-CLOSED. Each gated job's `if:` runs the job whenever the
# filter did not positively report docs-only, including when the filter itself
# failed. Without `!cancelled()` a failing `changes` would skip its dependants
# instead, and GitHub counts a skipped required status check as a pass -- so a
# broken filter would wave an untested change through. Detection must fail
# red, never open.
#
# No `CI Gate` job: `main` requires no status check today. If protection is
# ever added, note that a matrix job skipped at the job level is never
# expanded, so a docs-only run never reports `Platform (macos-latest)` or
# `Platform (ubuntu-24.04-arm)`; require an aggregating gate job then, not the
# expanded matrix contexts.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Change Filter
    runs-on: ubuntu-latest
    # Scoped to this job alone. `pull-requests: read` is what
    # dorny/paths-filter needs to list a pull request's files; without it the
    # job dies with "Resource not accessible by integration". Declaring the
    # block here rather than at workflow level leaves every other job's token
    # exactly as it is today.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # a push diffs against its base commit locally

      # A push carries its base in `github.event.before`. That sha is all-zeros
      # on a branch's first push and can name a commit a force-push discarded,
      # so establish that it is real and reachable before diffing. Leaving
      # `sha` empty skips the filter below, which lands on docs_only=false.
      - name: Resolve the push base
        id: base
        if: github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE}" ] \
            && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null
          then
            echo "sha=${BEFORE}" >> "$GITHUB_OUTPUT"
          else
            echo "Push base missing or unreachable; running the full suite."
          fi

      # On `pull_request` the action reads the file list from the API and
      # ignores `base`; on `push` it diffs against the sha resolved above.
      #
      # `docs` is the documentation allowlist that AGENTS.md points agents
      # at: a change is docs-only when every changed path is on it. `code`
      # names every path a build or a test reads. `all` matches every path,
      # and exists only for its count.
      - name: Filter Paths
        id: filter
        if: github.event_name == 'pull_request' || steps.base.outputs.sha != ''
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            docs:
              # Root and `docs/` Markdown only, not `**/*.md` or `docs/**`:
              # `tests/image_fixture_inventory.rs` reads INVENTORY.md beside
              # the fixtures under `assets/test-fixtures/`, enumerates the
              # directory that holds it, and reads the run transcripts under
              # `docs/image-archive-interop-runs/` that `inventory.json` names.
              - "*.md"
              - "docs/**/*.md"
              - ".markdownlint*"
              # The shared-instructions pin is inert to the build; only the
              # drift check reads it, and that runs in the ungated `markdown`.
              - ".agent-instructions.toml"
            code:
              - "src/**"
              - "tests/**"
              - "examples/**"
              - "assets/**"
              # Transcripts the fixture inventory test reads (see above).
              - "docs/image-archive-interop-runs/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".clippy.toml"
              - ".github/workflows/**"
            all:
              - "**"

      # Docs-only requires a POSITIVE result: documentation touched, code
      # untouched, and nothing else touched either. A filter output is true
      # when ANY changed path matches it, so `docs` alone is true for a pull
      # request that edits README.md and also some file nobody listed. The
      # count comparison closes that: every changed path has to be on the
      # docs allowlist, so a path in neither list falls through to the full
      # suite. This is an allowlist of the inert, not a denylist.
      - name: Decide Docs-Only
        id: decide
        env:
          DOCS: ${{ steps.filter.outputs.docs }}
          CODE: ${{ steps.filter.outputs.code }}
          DOCS_COUNT: ${{ steps.filter.outputs.docs_count }}
          ALL_COUNT: ${{ steps.filter.outputs.all_count }}
        run: |
          if [ "${DOCS}" = "true" ] \
            && [ "${CODE}" != "true" ] \
            && [ "${DOCS_COUNT}" = "${ALL_COUNT}" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # Recursive. The action's default glob is `*.{md,markdown}` --
          # repository root only -- so anything added under a directory
          # later would go unlinted without this.
          globs: "**/*.md"

      # The shared instruction-block drift check, which used to be a job of
      # its own calling `check-drift.yml` as a reusable workflow. Actions is
      # free on a public repository, so nothing was being billed for it;
      # what it cost was a job -- a scheduling slot and a row in every run
      # -- for nine seconds of byte comparison. As a step it runs inside a
      # job that already exists, and the fleet's other consumers carry it
      # the same way.
      #
      # It belongs in THIS job and nowhere else, because it must not
      # inherit the `docs_only` gate. `Change Filter` counts AGENTS.md and
      # `.agent-instructions.toml` as inert, so a pull request that edits
      # only a generated region, or only moves the pin, is docs-only by that
      # reckoning -- a gated step would skip the check on precisely the
      # changes that cause drift. This job asks the filter nothing, which is
      # what makes it the right host.
      #
      # `@main`, as the workflow reference was. The scripts are mechanism
      # and come from wherever this reference points; the blocks are content
      # and come from the pin in `.agent-instructions.toml`. Pinning the
      # action to a release would freeze the check's implementation at
      # whatever shipped beside those blocks.
      #
      # No `with:` block. The release to compare against and the blocks to
      # compare are both read from `.agent-instructions.toml`, so they have
      # one source rather than two that can disagree, and the apply job that
      # rewrites them never has to touch `.github/workflows/` -- which the
      # default GITHUB_TOKEN may not push to. The pin is a release tag
      # rather than a branch, so an edit upstream reaches this repository
      # through the pull request that moves it instead of turning every
      # unrelated pull request red.
      #
      # Guarded rather than left to the default `success()`, which would
      # skip this step whenever a step above it failed. The checks are
      # independent -- a drifted block is drift whether or not some other
      # file also breaks a lint rule -- and as separate jobs they both
      # always reported. A short-circuit here would hide drift on precisely
      # the changes that touch the most Markdown, and would report it only
      # after a later push had fixed something unrelated.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop,
      # not keep checking. The `checkout` clause is what keeps a failed
      # checkout from being reported as drift -- the action fails outright
      # when it cannot read `.agent-instructions.toml`, and in an empty
      # workspace that message names the pin for a problem that is not the
      # pin's.
      - uses: aicers/agent-instructions/check-drift@main
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}

  check:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `group_imports` is still nightly-gated, so it cannot live in a
      # `rustfmt.toml`. Passing it here is what makes the grouping actually
      # checked, and contributors have to pass it too.
      - name: Check formatting
        run: cargo fmt -- --check --config group_imports=StdExternalCrate

      # Twice, because `--all-targets` covers lib, bins, tests, benches, and
      # examples but touches no features: code behind `test-support` would
      # never be linted by the first run.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (test-support)
        run: cargo clippy --all-targets --features test-support -- -D warnings

      # Once, where clippy runs twice, and the asymmetry is deliberate. Clippy
      # needs both runs because `--all-targets` covers every target but no
      # feature. Documentation has no such gap: this crate carries no
      # `#[cfg(not(feature = ...))]`, so enabling `test-support` only adds
      # items and one run documents a superset of the default build.
      #
      # `--document-private-items` because the private items are where the
      # reasoning is: `validate_footer`, `envelope_present`, `Footer` and the
      # `pub(crate)` accessors carry the doc comments two other repositories
      # are written against, and a default `cargo doc` skips exactly those.
      - name: Docs
        run: cargo doc --no-deps --document-private-items --features test-support
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      # `test-support` exposes fixtures across the crate boundary, so it
      # changes what compiles. Run the suite under it as well.
      - name: Test (test-support)
        run: cargo test --features test-support
      # A dependent's build graph can turn on `serde_json/preserve_order`
      # through feature unification, which changes `serde_json::Map`'s key
      # order. Without the feature a `Map` is already sorted, so only this run
      # catches a spec digest whose canonical bytes skip
      # `Value::sort_all_objects`. Every digest test has `spec_digest` in its
      # path.
      - name: Test (spec digest, preserve_order)
        run: cargo test --features serde_json/preserve_order spec_digest

  # The crypto provider builds AWS-LC from source, and the README states its
  # prerequisites per platform. `check` and `test` cover Linux x86_64; this
  # job keeps the claim for the other platforms downstream runners use
  # checked: the suite on Linux aarch64, and a build of every target on macOS
  # arm64.
  platforms:
    name: Platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            command: cargo test --features test-support
          - os: macos-latest
            command: cargo build --all-targets --features test-support
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build or test
        run: ${{ matrix.command }}
