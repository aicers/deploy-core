name: Changelog

# Fails a pull request that changes CHANGELOG.md, unless it is the release
# pull request. release-plz writes the changelog from commit titles, and
# only in the pull request it opens, so a hand edit elsewhere would
# conflict with it or be lost: describe the change in the pull request's
# Conventional title instead, which becomes its changelog entry.
#
# A release pull request is one opened by `github-actions[bot]` from a
# `release-plz-` branch of this repository, all of them: anyone who can
# push can name a branch `release-plz-`. It is told by who opened it, not
# by who pushed its latest commit, so a release pull request a person
# pushed a fix to still passes. There is no label exception.
#
# `pull_request_target` with `pull-requests: read` only, so a pull request
# cannot change this check. It reads the pull request and its changed
# files from the API and checks out nothing, so no code from the pull
# request runs; what it reads reaches the shell only through environment
# variables and files.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions: {}

jobs:
  changelog:
    name: CHANGELOG.md untouched
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr="${RUNNER_TEMP}/pr.json"
          files="${RUNNER_TEMP}/changed-files.jsonl"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" > "${pr}"
          # One JSON object per changed file, from every page. A rename is
          # one entry, holding the old path in `previous_filename`.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files?per_page=100" \
            --jq '.[] | {status, filename, previous_filename}' > "${files}"
          expected="$(jq -r .changed_files "${pr}")"
          read_count="$(jq -s length "${files}")"
          # The API lists at most 3000 files. Never judge a partial list.
          if [ "${read_count}" != "${expected}" ]; then
            echo "::error::Read ${read_count} changed files, but the pull request has ${expected}; cannot tell whether it changes CHANGELOG.md."
            exit 1
          fi
          # Paths come from the pull request, so they are printed only as
          # JSON strings, behind a fixed word: nothing in one can start a
          # log line of its own.
          touched="$(jq -s -r '.[]
            | select(.filename == "CHANGELOG.md" or .previous_filename == "CHANGELOG.md")
            | "Changed: \(.status | @json) \(.previous_filename // .filename | @json) -> \(.filename | @json)"' "${files}")"
          if [ -z "${touched}" ]; then
            echo "CHANGELOG.md is not changed (${read_count} files read)."
            exit 0
          fi
          printf '%s\n' "${touched}"
          release_pr="$(jq -r '
            .user.login == "github-actions[bot]"
            and .user.type == "Bot"
            and .head.repo.full_name == .base.repo.full_name
            and (.head.ref | startswith("release-plz-"))
          ' "${pr}")"
          if [ "${release_pr}" = "true" ]; then
            echo "This is the release pull request, which release-plz writes CHANGELOG.md in."
            exit 0
          fi
          # Quoted by jq, and behind a fixed word, so that neither can be
          # read as a workflow command.
          echo "Opened by: $(jq '.user.login' "${pr}")"
          echo "Branch: $(jq '.head.label' "${pr}")"
          echo "::error::CHANGELOG.md is written by release-plz in the release pull request. Drop the change; the pull request title becomes its entry."
          exit 1
